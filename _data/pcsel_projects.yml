updated: "2026-08-21"
core:
  - name: "PCSEL Paper Library"
    tier: "Canonical"
    role: "Literature and evidence intake"
    summary: "A source-linked PCSEL corpus organized by research lineage, material system, wavelength, device geometry, and reported evidence. The current local inventory contains 534 paired PDF/Markdown records, including 513 DOI-linked entries."
    evidence: "Deterministic search, per-paper cards, validation reports, and a controlled path from indexed papers to standardized analyses."
    boundary: "The public site shows aggregate statistics only; private PDFs and source paths are not published."
    image: "/images/research/portal/pcsel_library_year_distribution.svg"
    alt: "Publication-year distribution from the local PCSEL literature library"

  - name: "pcsel-agent"
    tier: "Canonical"
    role: "Research orchestration and full-wave validation"
    summary: "The central research workflow for HX1/HX3 devices, 940/980 nm design, epitaxy and gain inputs, COMSOL/Lumerical studies, geometry audits, and process-sensitive review."
    evidence: "Run specifications, solver artifacts, mode-identity checks, convergence gates, and public-safe HTML design reports."
    boundary: "A high-Q point is never accepted by itself; geometry, mode identity, boundaries, process feasibility, and claim scope must also close."
    image: "/images/research/pcsel_agent_architecture.svg"
    alt: "Architecture of pcsel-agent from literature and specifications to solvers, verification, and reports"

  - name: "pcsel-cwt"
    tier: "Canonical"
    role: "Coupled-wave theory and paper reproduction"
    summary: "A source-grounded CWT codebase for square and triangular lattices, finite and infinite devices, Bloch-vector scans, far field, carrier diffusion, spatial hole burning, and gain-clamping studies."
    evidence: "Computed reproduction tables and curves are checked against the original papers with branch identity and numerical tolerances recorded."
    boundary: "CWT results are model-level evidence; independent Maxwell/COMSOL validation remains a separate layer."
    image: "/images/research/portal/cwt_fig5_length_dependence_sweep.png"
    alt: "Computed coupled-wave-theory device-length sweep for PCSEL mode branches"

  - name: "RLcomsol"
    tier: "Canonical"
    role: "COMSOL-backed design optimization"
    summary: "A DQN-based local search loop that connects actions to COMSOL geometry, eigenmode metrics, accepted-score guards, restarts, and repeatability checks."
    evidence: "The current public smoke panel completed three of three 20-step seeds; the best accepted point is reported with its action history and constraints."
    boundary: "The panel demonstrates a reproducible local workflow, not a global optimum or fabricated-device performance."
    image: "/images/research/portal/rlcomsol_three_seed_radius_guard_perm_a_20pt_curves.png"
    alt: "Three-seed RLcomsol optimization curves computed with COMSOL-backed evaluations"

  - name: "PCSELBook"
    tier: "Canonical"
    role: "Theory, derivation, and teaching backbone"
    summary: "A living Chinese technical monograph and knowledge site covering Maxwell and Bloch foundations, CWT and TCMT, PWEM/RCWA/FDTD/FEM, gain, injection, thermal effects, and engineering workflows."
    evidence: "The LaTeX source is paired with executable numerical examples for vertical TMM, PWEM, cutoff diagnosis, decay-Q calibration, and RCWA."
    boundary: "The book explains methods and assumptions; its examples do not replace device-specific solver sign-off."
    image: "/images/research/pcsel_device_concept.png"
    alt: "GaAs PCSEL layer and emission concept used across the theory and engineering workflow"
